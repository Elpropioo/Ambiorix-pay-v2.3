
name: Build Ambiorix Pay APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verificar archivos del proyecto
        run: |
          pwd
          ls -la
          test -f settings.gradle.kts || {
            echo "ERROR: Falta settings.gradle.kts en la raíz"
            exit 1
          }
          test -f app/build.gradle.kts || {
            echo "ERROR: No se encuentra app/build.gradle.kts"
            exit 1
          }

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: AmbiorixPay-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
